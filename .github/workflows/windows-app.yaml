name: Windows app

# Builds the Windows app with desktop/build.ps1, tests the installer on a real
# Windows machine (install, open the app window, uninstall), and attaches
# R6MatchStats-Setup.exe, R6MatchStats-Windows.zip, the browser edition (R6MatchStats-Browser.html)
# and their SHA256SUMS.txt to each
# published release, after a Microsoft Defender scan.
# The website's download button points at the newest release that has them.
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - "dissect/**"
      - "go.mod"
      - "go.sum"
      - "browser/**"
      - "wasm/**"
      - "main.go"
      - "scripts/*.py"
      - "scripts/*.json"
      - "scripts/requirements.txt"
      - ".github/workflows/windows-app.yaml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Signing certificate
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          EVENT: ${{ github.event_name }}
        run: |
          # The app's code-signing certificate: the WINDOWS_SIGNING_CERT secret (the .pfx file, base64)
          # and WINDOWS_SIGNING_PASSWORD (see desktop/README.md). Without them, releases are published
          # unsigned, and other builds sign with a throwaway certificate so signing is tested every time.
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          if ($env:CERT) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:CERT_PASSWORD)
            "R6_SIGN_TRUSTED=1" >> $env:GITHUB_ENV
          } elseif ($env:EVENT -ne "release") {
            $password = [guid]::NewGuid().ToString()
            $made = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=R6 Match Stats test signing" `
              -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
            Export-PfxCertificate -Cert $made -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
            Remove-Item "Cert:\CurrentUser\My\$($made.Thumbprint)"
            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $password)
            "R6_TEST_SIGN_PASSWORD=$password" >> $env:GITHUB_ENV  # a throwaway certificate's: not a secret
            "No WINDOWS_SIGNING_CERT secret: signing this test build with a throwaway certificate."
          } else {
            "::warning::No WINDOWS_SIGNING_CERT secret, so this release is unsigned. See desktop/README.md."
            exit 0
          }
          "Signing with $($cert.Subject), thumbprint $($cert.Thumbprint), valid until $($cert.NotAfter)"
          "R6_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "R6_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        env:
          R6_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          R6_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD || env.R6_TEST_SIGN_PASSWORD }}
        run: ./desktop/build.ps1

      - name: Check signatures
        if: env.R6_SIGN_THUMBPRINT != ''
        shell: pwsh
        run: |
          $files = @("dist\R6MatchStats\R6MatchStats.exe", "dist\R6MatchStats-Setup.exe") +
            @(Get-ChildItem dist\R6MatchStats -Recurse -Filter r6-dissect.exe | ForEach-Object FullName)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            "$file`: $($signature.Status), signed by $($signature.SignerCertificate.Subject), timestamped: $([bool]$signature.TimeStamperCertificate)"
            if ($signature.SignerCertificate.Thumbprint -ne $env:R6_SIGN_THUMBPRINT) { throw "$file isn't signed with the app's certificate" }
            if (-not $signature.TimeStamperCertificate) { throw "$file's signature isn't timestamped" }
            # a trusted certificate's signatures must check out; a throwaway one's root isn't trusted
            if ($env:R6_SIGN_TRUSTED -and $signature.Status -ne "Valid") { throw "$file's signature isn't valid: $($signature.StatusMessage)" }
          }
          Get-Content dist\SIGNATURE.txt

      - name: Test
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE) { throw "Go parser tests failed" }
          # the REST API's packages, for its tests (installed after the build, so never bundled)
          python -m pip install --quiet -r scripts/requirements-api.txt httpx
          if ($LASTEXITCODE) { throw "pip install failed" }
          python -m unittest discover -s scripts
          if ($LASTEXITCODE) { throw "app tests failed" }
          python -m unittest discover -s desktop
          if ($LASTEXITCODE) { throw "integrity tests failed" }
          python desktop\integrity.py verify dist\R6MatchStats
          if ($LASTEXITCODE) { throw "the built app doesn't match its own file list" }

      - name: Scan with Microsoft Defender
        shell: pwsh
        run: |
          # a release is only published once it's been scanned: if the scan can't run or doesn't
          # finish, a release stops here (fail closed); any other build just warns
          function Unscanned([string] $why) {
            if ("${{ github.event_name }}" -eq "release") { throw "$why, so the release isn't being published" }
            Write-Host "::warning::$why"
            exit 0
          }
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp) -or -not (Get-MpComputerStatus -ErrorAction SilentlyContinue).AntivirusEnabled) {
            Unscanned "Microsoft Defender isn't running on this machine"
          }
          & $mp -SignatureUpdate | Out-Host
          # exit codes don't tell a failed scan from a detection, so read the verdict line instead
          $out = (& $mp -Scan -ScanType 3 -File "$PWD\dist" -DisableRemediation) -join "`n"
          $code = $LASTEXITCODE
          $out
          if ($out -match 'found no threats') { "No threats found." }
          elseif ($out -match 'found \d+ threat') { throw "Microsoft Defender flagged a file in the build; not publishing it" }
          else { Unscanned "The Defender scan didn't finish (exit code $code)" }
          exit 0

      - name: Install
        shell: pwsh
        run: |
          $setup = Start-Process dist\R6MatchStats-Setup.exe -PassThru -Wait `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', '/LOG=install.log'
          if ($setup.ExitCode) { Get-Content install.log; throw "installer exited with $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\R6 Match Stats\R6MatchStats.exe"
          $startMenu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\R6 Match Stats.lnk"
          $desktop = "$([Environment]::GetFolderPath('Desktop'))\R6 Match Stats.lnk"
          foreach ($path in $app, $startMenu, $desktop) {
            if (-not (Test-Path $path)) { throw "missing after install: $path" }
          }
          # the shortcut carries the app's Windows identity, so pinning it groups with the open window
          $lnk = Get-Item $startMenu
          $id = (New-Object -ComObject Shell.Application).NameSpace($lnk.DirectoryName).ParseName($lnk.Name).ExtendedProperty("System.AppUserModel.ID")
          if ($id -ne "R6MatchStats.Desktop") { throw "the Start menu shortcut's AppUserModelID is '$id'" }
          if ($env:R6_SIGN_THUMBPRINT) {  # the installer made its uninstaller signed too
            $uninstaller = (Get-AuthenticodeSignature "$env:LOCALAPPDATA\Programs\R6 Match Stats\unins000.exe").SignerCertificate
            if ($uninstaller.Thumbprint -ne $env:R6_SIGN_THUMBPRINT) { throw "the uninstaller isn't signed with the app's certificate" }
          }
          $info = (Get-Item $app).VersionInfo
          "Installed $($info.ProductName) $($info.ProductVersion) to $app"

      - name: Open the app window
        shell: pwsh
        run: |
          $env:R6_SMOKE_TEST = "$PWD\smoke.json"
          $app = Start-Process "$env:LOCALAPPDATA\Programs\R6 Match Stats\R6MatchStats.exe" -PassThru
          if (-not $app.WaitForExit(180000)) { $app.Kill($true); throw "the app didn't finish loading in 3 minutes" }
          if (Test-Path smoke.json) { Get-Content smoke.json }
          if ($app.ExitCode) {
            Get-Content "$env:LOCALAPPDATA\R6MatchStats\app.log" -ErrorAction SilentlyContinue
            throw "the app window didn't show the app (exit code $($app.ExitCode))"
          }
          Start-Sleep -Seconds 3
          $left = Get-Process R6MatchStats -ErrorAction SilentlyContinue
          if ($left) { throw "the app's server kept running after its window closed" }

      - name: Uninstall
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\R6 Match Stats"
          $un = Start-Process "$dir\unins000.exe" -PassThru -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($un.ExitCode) { throw "uninstaller exited with $($un.ExitCode)" }
          Start-Sleep -Seconds 3  # the uninstaller removes its own files from a helper process
          if (Test-Path "$dir\R6MatchStats.exe") { throw "the app is still there after uninstalling" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\R6 Match Stats.lnk") { throw "Start menu shortcut left behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: R6MatchStats-Windows
          path: |
            dist/R6MatchStats-Setup.exe
            dist/R6MatchStats-Windows.zip
            dist/R6MatchStats-Browser.html
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            smoke.json
            smoke.json.png
            smoke.json.docked.png
            install.log
          if-no-files-found: ignore
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "dist/R6MatchStats-Setup.exe", "dist/R6MatchStats-Windows.zip", "dist/R6MatchStats-Browser.html", "dist/SHA256SUMS.txt"
          if (Test-Path dist/SIGNATURE.txt) { $files += "dist/SIGNATURE.txt" }  # who signed it, when it's signed
          gh release upload "${{ github.event.release.tag_name }}" @files --clobber
          # a Downloads section at the top of the notes, since GitHub lists the r6-dissect-* files first
          $tag = "${{ github.event.release.tag_name }}"
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()  # gh's output is UTF-8 (→, …, emoji)
          gh release view $tag --json body -q .body | Out-File -Encoding utf8 notes.md
          python desktop/release_notes.py "${{ github.repository }}" $tag notes.md @files
          if ($LASTEXITCODE) { throw "couldn't write the Downloads section" }
          gh release edit $tag --notes-file notes.md

      - name: Remove the signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP "signing.pfx") -ErrorAction SilentlyContinue
