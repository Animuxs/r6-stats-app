name: Build & Test

on: [pull_request]

jobs:
  build:
    strategy:
      matrix:
        go: ["1.23"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}
      - name: Checkout code into the Go module directory
        uses: actions/checkout@v3
      - name: Get dependencies
        run: go get -v -t -d ./...
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...

  # The app's tests on every pull request, before anything is merged: pyflakes, then every test in
  # scripts/ and desktop/ on all the runner's cores, and the coverage the tests must keep
  # (scripts/run_tests.py: at least 93% of the app, and 75% of each module).
  app-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements*.txt
      - name: Build r6-dissect
        run: go build -trimpath -o r6-dissect.exe .
      - name: Install
        run: python -m pip install --quiet -r scripts/requirements-dev.txt
      - name: App tests, lint and coverage
        run: python scripts/run_tests.py --lint --coverage
      - name: Windows app launcher tests
        run: python scripts/run_tests.py desktop
